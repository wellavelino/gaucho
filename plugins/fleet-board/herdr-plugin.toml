id = "gaucho.fleet-board"
name = "Fleet Board"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Every agent on every machine in one view"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open fleet board"
contexts = ["workspace"]
command = ["sh", "../../core/open"]

[[panes]]
id = "picker"
title = "Fleet Board"
platforms = ["linux", "macos"]
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "../../core/ui", "fleet"]
