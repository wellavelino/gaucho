id = "gaucho.landing"
name = "Landing"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Review a finished agent's branch, then open a PR, send it back or discard it"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Land finished work"
contexts = ["workspace"]
command = ["sh", "../../core/open"]

[[panes]]
id = "picker"
title = "Landing"
platforms = ["linux", "macos"]
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "../../core/ui", "land"]
